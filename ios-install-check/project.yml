# XcodeGen spec for the iPhone install check (see run.sh). Not part of the app.
name: InstallCheck
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    GENERATE_INFOPLIST_FILE: 'YES'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nfdzgg.installcheck.host
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    scheme:
      testTargets: [InstallUITests]
  InstallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InstallUITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nfdzgg.installcheck.uitests
        TEST_TARGET_NAME: Host
