name: iPhone install

# Adds the live app to an iPhone home screen (iOS Simulator, real iOS Safari)
# and opens it standalone. Called by deploy.yml after each deploy.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-carson-w5p9o7]
    paths:
      - ios-install-check/**
      - .github/workflows/ios-install.yml

permissions:
  contents: read

jobs:
  install:
    name: Add to Home Screen on iPhone (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: ios-install-check/run.sh
        env:
          LIVE_URL: https://nfdzgg.github.io/Progressive-Overload-Tracker/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-install-check
          path: ios-install-check/build/InstallCheck.xcresult
          retention-days: 14
