name: iPhone install

# Acceptance 1 on iPhone: adds the live app to the home screen of an iOS
# Simulator through the real iOS Safari (Share → Add to Home Screen), opens it
# from the home screen, and checks it runs standalone. Called by deploy.yml
# after each deploy; screenshots are printed to the job log.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Add to Home Screen on iPhone (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: ios-install-check/run.sh
        env:
          LIVE_URL: https://nfdzgg.github.io/Progressive-Overload-Tracker/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-install-check
          path: ios-install-check/build/InstallCheck.xcresult
          retention-days: 14
